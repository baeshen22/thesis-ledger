# Deploys the Supabase server functions and their secrets.
# Runs when you press "Run workflow" in the Actions tab, and on every push that changes supabase/functions.
name: Deploy backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: idlbzrsmtpvfpvwnzaee
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the Supabase access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add a repository secret named SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set function secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          args=(AI_DAILY_LIMIT=20 ALLOWED_ORIGIN=https://baeshen22.github.io)
          [ -n "$ANTHROPIC_API_KEY" ] && args+=("ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY") || echo "::warning::ANTHROPIC_API_KEY not set: screenshot import and the analyst will say 'not set up'."
          [ -n "$FINNHUB_API_KEY" ]  && args+=("FINNHUB_API_KEY=$FINNHUB_API_KEY")   || echo "::warning::FINNHUB_API_KEY not set: live prices will say 'not set up'."
          [ -n "$CRON_SECRET" ]      && args+=("CRON_SECRET=$CRON_SECRET")
          supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"

      - name: Deploy functions
        run: |
          for fn in analyst read-portfolio quotes delete-account; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
          done
          supabase functions deploy refresh-market --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
